apiVersion: database.opentenbase.org/v1alpha1
kind: OpenTenBaseCluster
metadata:
  name: demo
  generation: 2
spec:
  image: "<OPEN_TENBASE_IMAGE_NOT_SELECTED>"
  gtm:
    primaryCount: 1
    standbyCount: 1
    storage:
      required: true
  coordinators:
    # Provisional PoC representation: 2 primaries, each with 1 standby (4 total).
    primaryCount: 2
    standbyCountPerPrimary: 1
    storage:
      required: true
  dataNodes:
