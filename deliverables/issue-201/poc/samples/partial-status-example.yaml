      - id: "1"
        standbyCount: 1
        storage:
          required: true
  services:
    coordinatorClient:
      enabled: true
    gtmDiscovery:
      enabled: true
    internalDiscovery:
      enabled: true
      mode: HeadlessPerRoleAndShard
  bootstrap:
    ordering: GTMFirst
    topologyRegistration: PerMasterTracked
    groupCreation: ExplicitPhase
    retryPolicy: ObserveBeforeRetry
