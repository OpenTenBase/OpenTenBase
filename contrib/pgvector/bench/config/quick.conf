# Quick benchmark configuration for daily regression checks.
# Keep the profile name stable so result directories are predictable.

PROFILE_NAME=quick

# Use a larger dataset than smoke while keeping preparation practical.
ROWS=100000
DIMENSIONS=128
QUERY_COUNT=1000
RECALL_QUERY_COUNT=1000
TOP_K=10

# Use a compact IVFFlat matrix for quick comparisons.
LISTS_VALUES="100 200"
PROBES_VALUES="1 10"

# Keep one client for stable single-session latency measurements.
CLIENT_VALUES="1"
JOBS=1

# Run a short warmup and measurement for each configuration.
WARMUP_SECONDS=2
DURATION_SECONDS=5
REPEATS=1

# Keep the main planner and memory settings fixed across runs.
JIT=off
ENABLE_SEQSCAN=off
WORK_MEM=64MB

# Use fixed, different seeds for item and query vectors.
RANDOM_SEED=20260911
CLUSTERS=1000
CATEGORY_COUNT=1000
QUERY_RANDOM_SEED=20260912

# Database connection parameters.
DB_HOST=127.0.0.1
DB_PORT=6543
DB_USER=linnaid
DB_NAME=pgvector_bench
