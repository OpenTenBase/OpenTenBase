# Controlled-disk benchmark configuration.

# This profile targets the 8M-row disk experiment.
# Keep this profile separate from the 1M-row memory profile.

PROFILE_NAME=disk


ROWS=8000000
DIMENSIONS=128
QUERY_COUNT=1000
RECALL_QUERY_COUNT=100
TOP_K=10

# Start with one conservative list count to control index-build memory.

# Expand this matrix only after the first index build succeeds and resource
# usage has been recorded.
LISTS_VALUES="1000"
PROBES_VALUES="1 10 50"

# Use one client for the initial controlled-disk profile.
CLIENT_VALUES="1"
JOBS=2

# Use a longer warmup and measurement window for the large dataset.
WARMUP_SECONDS=15
DURATION_SECONDS=30
REPEATS=1

# Keep planner, query memory, and index-build memory explicit.
JIT=off
ENABLE_SEQSCAN=off
WORK_MEM=64MB
MAINTENANCE_WORK_MEM=2GB

# Use fixed, different seeds for item and query vectors.
RANDOM_SEED=20260931
CLUSTERS=10000
CATEGORY_COUNT=1000
QUERY_RANDOM_SEED=20260932

DB_HOST=127.0.0.1
DB_PORT=6543
DB_USER=linnaid
DB_NAME=pgvector_bench
