# Large-scale memory benchmark configuration.
# This profile targets the 1M-row memory experiment.

# The 8M-row controlled-disk experiment should use a separate copied profile.

PROFILE_NAME=large

ROWS=1000000
DIMENSIONS=128
QUERY_COUNT=1000
RECALL_QUERY_COUNT=100
TOP_K=10

LISTS_VALUES="1000 2000"
PROBES_VALUES="1 10 50"

# Use single-client measurements for the first large-scale memory profile.
CLIENT_VALUES="1"
JOBS=2

# Use a longer warmup and measurement window than the smoke profile.
WARMUP_SECONDS=15
DURATION_SECONDS=30
REPEATS=1

# Keep planner and memory settings fixed for reproducible comparisons.
JIT=off
ENABLE_SEQSCAN=off
WORK_MEM=64MB
MAINTENANCE_WORK_MEM=1GB

# Use fixed, different seeds for item and query vectors.
RANDOM_SEED=20260921
CLUSTERS=10000
CATEGORY_COUNT=1000
QUERY_RANDOM_SEED=20260922

DB_HOST=127.0.0.1
DB_PORT=6543
DB_USER=linnaid
DB_NAME=pgvector_bench
